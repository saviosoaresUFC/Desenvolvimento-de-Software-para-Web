<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas de COVID-19 - Países</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .highlight-brazil {
            background-color: #dbeafe;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">Painel COVID-19: Países</h1>
            <p class="text-md text-gray-600 mt-2">Análise de dados de casos confirmados e falecimentos no mundo.</p>
        </header>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                País</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Casos Confirmados</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Falecimentos</th>
                        </tr>
                    </thead>
                    <tbody id="countries-table-body" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="3" class="px-6 py-12 text-center text-gray-500">
                                <div role="status" class="flex justify-center items-center">
                                    <svg aria-hidden="true"
                                        class="w-8 h-8 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600"
                                        viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                                            fill="currentColor" />
                                        <path
                                            d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                                            fill="currentFill" />
                                    </svg>
                                    <span class="sr-only">Carregando...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchCountriesData() {
            const tableBody = document.getElementById('countries-table-body');
            const url = 'https://covid19-brazil-api.now.sh/api/report/v1/countries';

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Erro na API: ${response.statusText}`);
                }
                const { data } = await response.json();

                tableBody.innerHTML = '';

                data.forEach(country => {
                    const row = document.createElement('tr');

                    if (country.country === "Brazil") {
                        row.classList.add('highlight-brazil');
                    }

                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap">${country.country}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${country.confirmed.toLocaleString('pt-BR')}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${country.deaths.toLocaleString('pt-BR')}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (error) {
                console.error("Falha ao buscar dados dos países:", error);
                tableBody.innerHTML = `<tr><td colspan="3" class="px-6 py-12 text-center text-red-500 font-semibold">Não foi possível carregar os dados. Tente novamente mais tarde.</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchCountriesData);
    </script>

</body>
</html>
